[package]
name = "weldcore"
version = "0.1.0"
edition = "2021"
description = "Core domain logic for the Kern Energy Weld Tracker (database, auth, reports)."

[lib]
name = "weldcore"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["alloc"] }
getrandom = "0.2"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
