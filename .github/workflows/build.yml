name: Build Windows App

# Builds SENTRIX — Assurance Console as a per-user Windows installer (no admin
# rights required to install) plus the raw portable executable. Runs on every
# push to the app, and publishes a downloadable Release when you push a tag
# like `v0.1.0`.

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - ".github/workflows/build.yml"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Fast, OS-independent gate on the pure-Rust domain crate. Runs first; the
  # Windows bundle build depends on it, so a logic regression fails CI in ~1
  # minute instead of after a full Tauri build.
  weldcore-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/weldcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ runner.os }}-weldcore-${{ hashFiles('app/Cargo.lock', 'app/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-weldcore-

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        # Fails on a security vulnerability; unmaintained/unsound advisories in
        # transitive GUI-stack crates are warnings only and do not block.
        working-directory: app
        run: cargo audit

  build-windows:
    needs: weldcore-checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/Cargo.lock', 'app/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit shipped dependencies
        # Only the production dependency tree ships in the app; dev-only tooling
        # (e.g. the Vite dev server) is out of scope for the installed product.
        run: npm audit --omit=dev --audit-level=high

      - name: Build Tauri app (NSIS per-user installer)
        run: npm run tauri build -- --bundles nsis

      - name: Verify the exe carries the repo icon
        shell: bash
        run: |
          set -euo pipefail
          # Byte-level proof: the .ico's PNG image is stored verbatim as an
          # RT_ICON resource, so a slice of it must appear inside the exe.
          # Fails the build if resource embedding silently used a stale cache.
          sed 's/^          //' <<'PYEOF' > /tmp/verify_icon.py
          import sys
          ico = open('src-tauri/icons/icon.ico', 'rb').read()
          start = ico.find(b'\x89PNG')
          assert start > 0, 'icon.ico has no PNG image'
          needle = ico[start + 64 : start + 256]
          # Fingerprint of the RETIRED weld-bubble icon -- must never ship again.
          old_icon = bytes.fromhex('b188d0d890823b0bf50705c585821b71935010448406a14568e89f0d56dda850')
          exe = None
          for cand in ('target/release/Sentrix.exe', 'target/release/weld-tracker.exe'):
              try:
                  exe = open(cand, 'rb').read()
                  break
              except OSError:
                  pass
          assert exe, 'no built exe found'
          if needle not in exe:
              sys.exit('::error::built exe does NOT contain icons/icon.ico -- resource embedding failed (stale build cache?)')
          if old_icon in exe:
              sys.exit('::error::built exe STILL contains the retired weld-bubble icon')
          print('OK: exe contains the current icon and none of the retired one')
          PYEOF
          python /tmp/verify_icon.py

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Two ready-to-deploy shapes and nothing else:
          #   installer/  one per-user setup exe (single PC, no admin needed)
          #   portable/   copy the whole folder to a network share and run it
          mkdir -p dist-out/installer dist-out/portable

          setup=$(ls target/release/bundle/nsis/*-setup.exe | head -n1)
          cp "$setup" dist-out/installer/

          # Portable exe: Tauri names the main binary after productName
          # ("Sentrix"); fall back to the Cargo package name for older configs.
          if   [ -f target/release/Sentrix.exe ];      then portable=target/release/Sentrix.exe
          elif [ -f target/release/weld-tracker.exe ]; then portable=target/release/weld-tracker.exe
          else echo "::error::no portable exe found in target/release"; ls -la target/release; exit 1
          fi
          cp "$portable" dist-out/portable/Sentrix.exe
          # The data folder beside the exe IS the switch: when Sentrix.exe sees
          # it, it keeps the shared database inside it (data\sentrix.db) — one
          # set of records for everyone who runs the exe from this folder.
          mkdir -p dist-out/portable/data
          printf 'The shared SENTRIX database lives in this folder (sentrix.db appears on first run).\r\nKeep this folder next to Sentrix.exe, and back it up.\r\n' > dist-out/portable/data/README.txt
          sed -e 's/^          //' -e 's/$/\r/' <<'TXT' > dist-out/READ-ME-FIRST.txt
          SENTRIX — Assurance Console — how to deploy

          The zip holds two ready-to-go shapes. Pick ONE — you don't need both.

          SHARED (a team on a network drive) — recommended:
            1. Copy the whole "portable" folder onto your network drive and
               rename it, e.g.  \\server\apps\Sentrix\
            2. Everyone runs Sentrix.exe from that folder — make a desktop
               shortcut to it. No install, no admin rights.
            3. The "data" folder next to the exe holds the shared database —
               keep them together and every user sees the same work orders,
               welds and reports. Back up the data folder.
            4. First run: sign in as admin / password, set a new password, then
               create a login for each user (Administration > Users).

          SINGLE PC (your records only):
            Run installer\...-setup.exe. It installs per-user — no admin
            rights needed — and keeps its database on that PC.

          Point at a specific shared database file instead (optional):
            Put a file named sentrix.json next to the exe containing:
              { "database_path": "\\\\server\\apps\\Sentrix\\data\\sentrix.db" }
            (or set the SENTRIX_DB environment variable to that path.)

          If Windows warns about an "unrecognized app" on first run:
            The exe is not code-signed yet, so Windows SmartScreen is cautious
            with files downloaded from the internet. Either click
            "More info > Run anyway", or right-click the exe > Properties >
            tick "Unblock" > OK. Files run from your own network drive are
            normally not flagged at all.

          Needs Microsoft Edge WebView2 (already on Windows 11 and kept
          current on Windows 10 by Microsoft; the installer fetches it
          automatically if missing).

          Settings > About shows the exact database file each user is on.
          TXT
          {
            echo "SENTRIX build r${{ github.run_number }}"
            echo "commit  ${{ github.sha }}"
            echo "built   $(date -u +%Y-%m-%dT%H:%MZ) (UTC)"
          } > dist-out/BUILD-INFO.txt
          ls -laR dist-out

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentrix-windows-r${{ github.run_number }}
          path: app/dist-out/*
          if-no-files-found: error

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist-out/*
          generate_release_notes: true
