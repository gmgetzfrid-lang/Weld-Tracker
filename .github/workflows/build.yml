name: Build Windows App

# Builds SENTRIX — Assurance Console as a per-user Windows installer (no admin
# rights required to install) plus the raw portable executable. Runs on every
# push to the app, and publishes a downloadable Release when you push a tag
# like `v0.1.0`.

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - ".github/workflows/build.yml"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Fast, OS-independent gate on the pure-Rust domain crate. Runs first; the
  # Windows bundle build depends on it, so a logic regression fails CI in ~1
  # minute instead of after a full Tauri build.
  weldcore-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/weldcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ runner.os }}-weldcore-${{ hashFiles('app/Cargo.lock', 'app/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-weldcore-

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  build-windows:
    needs: weldcore-checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/Cargo.lock', 'app/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (NSIS per-user installer)
        run: npm run tauri build -- --bundles nsis

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-out

          # NSIS per-user installer — exactly one -setup.exe is expected.
          setup=$(ls target/release/bundle/nsis/*-setup.exe | head -n1)
          cp "$setup" dist-out/

          # Portable exe: Tauri names the main binary after productName
          # ("Sentrix"); fall back to the Cargo package name for older configs.
          if   [ -f target/release/Sentrix.exe ];      then portable=target/release/Sentrix.exe
          elif [ -f target/release/weld-tracker.exe ]; then portable=target/release/weld-tracker.exe
          else echo "::error::no portable exe found in target/release"; ls -la target/release; exit 1
          fi
          cp "$portable" dist-out/Sentrix-portable.exe
          # Ship a portable marker so the portable exe keeps its database in a
          # data\ folder beside it — drop the exe + this marker on a network
          # share and everyone who runs it shares the same data.
          printf 'This marker tells Sentrix-portable.exe to keep its shared database in the data folder next to the exe.\r\n' > dist-out/sentrix.portable
          cat > dist-out/READ-ME-FIRST.txt <<'TXT'
          SENTRIX — Assurance Console — how to deploy

          SHARED (a team on a network drive) — recommended:
            1. Copy Sentrix-portable.exe and sentrix.portable together
               into a folder on your network drive, e.g. \\server\apps\Sentrix\
            2. Everyone runs Sentrix-portable.exe from that folder.
            3. The shared database is created in a "data" subfolder beside the exe,
               so every user sees the same work orders, welds and reports.
            4. First run: sign in as admin / password, then set a new password and
               create a login profile for each user (Administration > Users).

          Point at a specific shared file instead:
            Put a file named sentrix.json next to the exe containing:
              { "database_path": "\\\\server\\apps\\Sentrix\\data\\sentrix.db" }
            (or set the SENTRIX_DB environment variable to that path.)

          SINGLE PC:
            Run the ...-setup.exe installer (installs per-user, no admin). Its
            database stays on that PC only. Delete sentrix.portable if you
            copied it and don't want shared mode.

          Settings > About shows the exact database file each user is on.
          TXT
          ls -la dist-out

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentrix-windows
          path: app/dist-out/*
          if-no-files-found: error

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist-out/*
          generate_release_notes: true
